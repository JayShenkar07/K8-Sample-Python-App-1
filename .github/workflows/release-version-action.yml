name: Generate Release

on:
  workflow_dispatch:

jobs:
  generate-release:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Git
      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
        
      # Get the latest release tag or initialize the first version
      - name: Get latest release tag
        id: latest_tag
        run: |
          # Try to get the latest tag
          latest_tag=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "v0.0.1.0")
          echo "Latest tag: $latest_tag"
          echo "latest_tag=$latest_tag" >> $GITHUB_ENV

      # Increment the patch version
      - name: Increment patch version
        id: increment_version
        run: |
          current_version="${{ env.latest_tag }}"
          echo "Current version: $current_version"
          # Use regex to capture version number and increment the patch version
          new_version=$(echo $current_version | sed -E 's/v([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)/v\1.\2.\3.$((\4 + 1))/')
          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_ENV

      # Create a new tag with the incremented version
      - name: Create new tag
        run: |
          git tag ${{ env.new_version }}
          git push https://x-access-token:${{ secrets.JAY_GHP_SECRET }}@github.com/${{ github.repository }} ${{ env.new_version }}

      # Generate release notes
      - name: Generate release notes
        id: release_notes
        run: |
          notes=$(git log ${{ env.latest_tag }}..HEAD --oneline)
          echo "Release notes: $notes"
          echo "release_notes=$notes" >> $GITHUB_ENV

      # Create a GitHub release
      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.new_version }}
          release_name: "Release ${{ env.new_version }}"
          body: ${{ env.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.JAY_GHP_SECRET }}
